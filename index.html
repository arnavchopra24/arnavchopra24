---
layout: default
nav: journal
body_class: home-page
---
<div class="ticker" aria-label="Deals in the journal"><div class="wrap ticker-inner" id="ticker"></div></div>

<section class="wrap front">
  <div class="lead" id="lead">
    <noscript><p class="empty">Turn on JavaScript to see the latest analysis.</p></noscript>
  </div>
  <aside class="side">
    <span class="side-label">More analysis</span>
    <div id="more"></div>
    <div class="side-stats">
      <span class="side-label">At a glance</span>
      <dl>
        <div><dt>Deals analysed</dt><dd class="num" id="stat-count">0</dd></div>
        <div><dt>Sectors covered</dt><dd class="num" id="stat-sectors">0</dd></div>
        <div><dt>Latest analysis</dt><dd class="num" id="stat-latest">—</dd></div>
      </dl>
    </div>
  </aside>
</section>

<section class="filters" aria-label="Filter deals">
  <div class="wrap filters-inner">
    <label class="filter filter-search">
      <span class="filter-label">Search the archive</span>
      <input type="search" id="f-search" placeholder="Acquirer, target, bank, sector…" autocomplete="off">
    </label>
    <label class="filter"><span class="filter-label">Sector</span><select id="f-sector"><option value="">All sectors</option></select></label>
    <label class="filter"><span class="filter-label">Deal type</span><select id="f-type"><option value="">All types</option></select></label>
    <label class="filter"><span class="filter-label">Advisor</span><select id="f-advisor"><option value="">All advisors</option></select></label>
    <label class="filter"><span class="filter-label">Verdict</span><select id="f-verdict"><option value="">All verdicts</option></select></label>
  </div>
</section>

<section class="wrap archive" id="archive" data-src="{{ '/deals.json' | relative_url }}">
  <div class="archive-head">
    <span class="h">The archive</span>
    <span class="caps" id="archive-count"></span>
  </div>
  <div class="card-grid" id="card-grid"></div>
  <div class="empty" id="empty-state" hidden></div>
  <noscript><p class="empty">Turn on JavaScript to browse the archive.</p></noscript>
</section>
